# Builds the app, exports the real Demucs v4 models (4 and 6 stems), checks the export against
# Demucs, and publishes everything to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # SoundLab-Core is public; fetch it over HTTPS (the lockfile records an SSH address).
      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # The model is exported once and cached until the export tool changes.
      - id: models
        uses: actions/cache@v4
        with:
          path: models-out
          key: models-htdemucs-6s-${{ hashFiles('tools/export_demucs_onnx.py', 'tools/check_export.py') }}
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.models.outputs.cache-hit != 'true'
        name: Export Demucs v4 to ONNX and check it
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install demucs onnx onnxscript onnxruntime numpy
          for m in htdemucs htdemucs_6s; do
            python tools/export_demucs_onnx.py $m models-out --part-mb 90
            python tools/check_export.py $m models-out
          done
      - run: mkdir -p dist/models && cp -r models-out/. dist/models/ && ls -la dist/models

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The models make this a large site; GitHub can take over 10 minutes to copy it.
          timeout: 1800000
